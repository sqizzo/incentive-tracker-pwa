# Netlify mendeteksi Next.js otomatis (OpenNext adapter). File ini hanya mengunci perintah build.
# Set environment variables NEXT_PUBLIC_SUPABASE_URL & NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
# di Netlify → Site configuration → Environment variables.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
